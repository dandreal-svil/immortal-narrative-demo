name: Publish Immortal Narrative demo

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'chunks/**'
      - '.github/workflows/pages.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'chunks/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Assemble prototype script
        run: cat chunks/*.part > app.generated.js

      - name: Check JavaScript syntax
        run: node --check app.generated.js

      - name: Check recovered UI contracts
        run: |
          grep -F 'threshold-memory-v2-phone-thriller' app.generated.js
          grep -F 'Dialogo · Uomo nel riflesso' app.generated.js
          grep -F 'Ambiente · Suono e percezione' app.generated.js
          grep -F 'Intento della presenza' app.generated.js
          grep -F 'Segnale osservato' app.generated.js
          grep -F 'Consiglio · Modalità Storia' app.generated.js
          grep -F 'index-CXYED7y6.css' index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public artifact
        run: |
          mkdir _site
          cp index.html styles.css _site/
          cat chunks/*.part > _site/app.js
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
