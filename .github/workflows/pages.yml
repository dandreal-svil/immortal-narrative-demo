name: Publish Immortal Narrative demo

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'central-feedback-v2.js'
      - 'semantic-ui.js'
      - 'styles.css'
      - '.github/workflows/pages.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'app.js'
      - 'central-feedback-v2.js'
      - 'semantic-ui.js'
      - 'styles.css'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check central-feedback-v2.js
          node --check semantic-ui.js

      - name: Check original baseline and semantic contracts
        run: |
          grep -F 'threshold-memory-v1' app.js
          grep -F 'Ora guarda l’uomo con la barba e il cappello nero, subito dietro di te.' app.js
          grep -F 'Non sono io quello che devi temere.' app.js
          grep -F 'assets/index-CXYED7y6.css' index.html
          grep -F 'central-feedback-v2.js' index.html
          grep -F 'formsubmit.co/immortalnarrative.project@gmail.com' central-feedback-v2.js
          grep -F 'function setTextIfChanged' central-feedback-v2.js
          grep -F 'element.textContent === value' central-feedback-v2.js
          grep -F 'new MutationObserver(renderStatus).observe(app' central-feedback-v2.js
          grep -F 'semantic-ui.js' index.html
          grep -F 'dialogue-bubble--mirror' semantic-ui.js
          grep -F 'Uomo nel riflesso' semantic-ui.js
          grep -F 'environment-block' semantic-ui.js
          grep -F 'action-selection' semantic-ui.js
          grep -F 'border-top: 11px solid var(--dialogue-border)' styles.css
          grep -F '.narration-block' styles.css

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public artifact
        run: |
          mkdir _site
          cp index.html app.js central-feedback-v2.js semantic-ui.js styles.css _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
