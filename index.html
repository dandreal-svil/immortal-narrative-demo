<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1014">
  <meta name="description" content="Un thriller interattivo in cui ricostruisci le tue vite perdute e trasformi i ricordi in strategia.">
  <title>Immortal Narrative — Prototipo esteso v4</title>
  <link rel="stylesheet" href="https://immortal-narrative-m0.dandrea-l.chatgpt.site/assets/index-CXYED7y6.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .photo-message img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
    .photo-message--crop img {
      aspect-ratio: 1 / 1;
      object-position: 74% 42%;
      transform: scale(1.45);
      transform-origin: 74% 42%;
    }
    .photo-message--crop {
      max-height: 390px;
    }
    .mini-contact {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 1px 7px;
      color: #cdd8e3;
      font-size: .56rem;
      font-weight: 750;
    }
    .mini-contact span {
      display: grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border: 1px solid rgba(130,174,218,.34);
      border-radius: 50%;
      background: #1a2631;
    }
    .flashback-panel {
      width: min(820px, 100%);
      padding: clamp(22px, 4vw, 44px);
      background:
        linear-gradient(135deg, rgba(217,161,74,.10), transparent 55%),
        rgba(12,15,20,.96);
      border: 1px solid rgba(217,161,74,.28);
      border-radius: 24px;
      box-shadow: 0 28px 80px rgba(0,0,0,.48);
    }
    .flashback-copy {
      max-width: 66ch;
      margin: 22px 0;
      color: #d4d0c8;
      font: 1.05rem/1.75 Georgia, "Times New Roman", serif;
    }
    .flashback-copy blockquote {
      margin: 22px 0;
      padding: 14px 18px;
      color: #f0c783;
      background: rgba(217,161,74,.08);
      border-left: 3px solid #d9a14a;
      font-style: italic;
    }
    .speech--revealed {
      background: #f5eee4;
    }
    .experience--solo > .narrative-panel {
      width: min(760px, 100%);
    }
    @media (max-width: 720px) {
      .flashback-panel { padding: 20px; }
      .photo-message--crop { max-height: 320px; }
    }
  </style>
  <script src="central-feedback-v2.js" defer></script>
  <script src="app.js" defer></script>
  <script src="semantic-ui.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <noscript>Questo prototipo richiede JavaScript.</noscript>
</body>
</html>
